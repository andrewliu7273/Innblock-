<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Innblock Product Page Wireframe</title>
    <meta
      name="description"
      content="Structural wireframe prototype for the Innblock ecommerce product page."
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header" aria-label="Primary navigation">
      <a class="brand" href="#" aria-label="Innblock home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>INNBLOCK</span>
      </a>

      <nav class="primary-nav" aria-label="Shop categories">
        <a href="#new-rooms">New Rooms</a>
        <a href="#kits">Kits</a>
        <a href="#accessories">Accessories</a>
        <a href="#characters">Characters</a>
        <a href="#pickup">Pickup</a>
        <a href="#about">About</a>
      </nav>

      <div class="header-actions" aria-label="Shopping tools">
        <button class="text-control" type="button">Search</button>
        <button class="text-control" type="button">
          Cart <span data-cart-count>0</span>
        </button>
      </div>
    </header>

    <main class="product-page">
      <section class="page-intro" aria-labelledby="page-title">
        <div class="background-cloud-container">
          <div class="background-cloud-track">
            <img src="assets/day-cloud-sheet-bg-01-5clouds.png" class="cloud">
            <img src="assets/day-cloud-sheet-bg-02-3clouds.png" class="cloud">
            <img src="assets/day-cloud-sheet-bg-03-2clouds.png" class="cloud">

            <!-- duplicates for seamless looping -->
            <img src="assets/day-cloud-sheet-bg-01-5clouds.png" class="cloud">
            <img src="assets/day-cloud-sheet-bg-02-3clouds.png" class="cloud">
            <img src="assets/day-cloud-sheet-bg-03-2clouds.png" class="cloud">
          </div>
        </div>
        
        <div>
          <p class="section-label">Rooms</p>
          <h1 id="page-title">Build Your InnBlock Stack</h1>
          <p class="intro-copy">
            Wireframe structure for a scrollable apartment-style product page.
          </p>
        </div>

        <form class="filter-bar" aria-label="Product filters">
          <label>
            <span>Room Type</span>
            <select id="room-filter">
              <option value="all">All Rooms</option>
              <option value="living">Living</option>
              <option value="utility">Utility</option>
              <option value="display">Display</option>
            </select>
          </label>

          <label>
            <span>Category</span>
            <select id="category-filter">
              <option value="all">Category</option>
              <option value="base">Base Rooms</option>
              <option value="theme">Theme Rooms</option>
              <option value="collector">Collector Rooms</option>
            </select>
          </label>

          <label>
            <span>Theme</span>
            <select id="theme-filter">
              <option value="all">Theme</option>
              <option value="home">Home</option>
              <option value="studio">Studio</option>
              <option value="shop">Shop</option>
            </select>
          </label>

          <label>
            <span>Sort</span>
            <select id="sort-filter">
              <option value="featured">Sort: Featured</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="name">Name</option>
            </select>
          </label>
        </form>
      </section>

      <section class="wireframe-shell" aria-label="Innblock apartment product grid">
        <div class="tower-grid" id="tower-grid"></div>

        <aside class="elevator" aria-label="Page elevator navigation">
          <button class="elevator-button" type="button" data-elevator="up">Up</button>
          <div class="elevator-rail" aria-hidden="true">
            <span class="elevator-car" id="elevator-car">1</span>
          </div>
          <p class="floor-readout">
            Floor <span id="current-floor">1</span>/<span id="total-floors">3</span>
          </p>
          <button class="elevator-button" type="button" data-elevator="down">Down</button>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
